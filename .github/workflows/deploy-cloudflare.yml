name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist/server
          command: deploy --prebuilt
          secrets: |
            SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            SUPABASE_PUBLISHABLE_KEY
            AMOCRM_CLIENT_ID
            AMOCRM_CLIENT_SECRET
            AMOCRM_REDIRECT_URI
            GEMINI_API_KEY
            OPENAI_API_KEY
            VAPID_PRIVATE_KEY
            VAPID_PUBLIC_KEY
            VAPID_SUBJECT
            CRON_SECRET
            GOOGLE_SERVICE_ACCOUNT_EMAIL
            GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_HR_BOT_TOKEN
            TELEGRAM_HR_WEBHOOK_SECRET
            TELEGRAM_WEBHOOK_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          AMOCRM_CLIENT_ID: ${{ secrets.AMOCRM_CLIENT_ID }}
          AMOCRM_CLIENT_SECRET: ${{ secrets.AMOCRM_CLIENT_SECRET }}
          AMOCRM_REDIRECT_URI: ${{ secrets.AMOCRM_REDIRECT_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_HR_BOT_TOKEN: ${{ secrets.TELEGRAM_HR_BOT_TOKEN }}
          TELEGRAM_HR_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_HR_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
